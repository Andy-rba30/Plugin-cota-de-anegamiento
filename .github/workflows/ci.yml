name: Pruebas y empaquetado

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencias
        run: python -m pip install --upgrade pip numpy pytest
      - name: Pruebas del núcleo de cálculo
        run: python -m pytest -q
      - name: Empaquetar complemento
        run: python scripts/empaquetar.py dist
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: cota_anegamiento
          path: dist/cota_anegamiento.zip
